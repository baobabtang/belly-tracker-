<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Belly Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 480px; margin: auto; padding: 20px 16px 40px;
      background: #F2F2F7; color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { font-size: 26px; margin: 0 0 14px; }
    h2 { font-size: 19px; margin: 22px 0 12px; }
    .card, .entry {
      background: white; border-radius: 14px; padding: 16px;
      margin-bottom: 12px; box-shadow: 0 1px 3px #0001;
    }
    .group { margin-bottom: 14px; }
    label {
      display: flex; justify-content: space-between; gap: 8px;
      margin-bottom: 6px; color: #666; font-size: 13px; font-weight: 600;
    }
    input:not([type="range"]), select, textarea {
      width: 100%; min-width: 0; padding: 12px; border: 1px solid #ddd;
      border-radius: 10px; background: #fafafa; font: inherit; font-size: 16px;
    }
    .date-row { display: flex; gap: 8px; }
    .date-row input { flex: 1; }
    textarea { min-height: 70px; resize: vertical; }
    input[type="range"] { width: 100%; accent-color: #007aff; }
    .row-labels { display: flex; justify-content: space-between; color: #777; font-size: 11px; }
    .score { color: #111; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 11px;
      background: #007aff; color: white; font: inherit; font-weight: 650;
      cursor: pointer;
    }
    button.secondary { margin-top: 9px; background: #e5e5ea; color: #111; }
    .carousel {
      display: flex; gap: 12px; overflow-x: auto;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    }
    .slide { flex: 0 0 100%; scroll-snap-align: start; }
    .chart-box { height: 230px; }
    .dots { display: flex; justify-content: center; gap: 7px; margin: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 9px; background: #bbb; }
    .dot.active { width: 18px; background: #007aff; }
    .entry-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #666; }
    .entry p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .scores { margin-top: 8px; font-size: 13px; }
    .entry-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .entry-actions button { width: auto; padding: 7px 10px; background: #eee; color: #111; font-size: 13px; }
    .empty { text-align: center; color: #777; padding: 14px; }
    #csvFile { display: none; }
  </style>
</head>

<body>
  <h1 id="formTitle">Log Entry</h1>

  <section class="card">
    <form id="entryForm">
      <input id="entryId" type="hidden">

      <div class="group">
        <label>Date & time</label>
        <div class="date-row">
          <input id="date" type="date" required>
          <input id="time" type="time" required>
        </div>
      </div>

      <div class="group">
        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Stool</option>
          <option>Symptom</option>
          <option>Medication</option>
          <option>Note</option>
        </select>
      </div>

      <div class="group">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="What did you eat, or what did you notice?"></textarea>
      </div>

      <div class="group">
        <label for="mood">Mood <span class="score" id="moodValue"></span></label>
        <input id="mood" type="range" min="0" max="10" value="5">
        <div class="row-labels"><span>0 (Low)</span><span>10 (Great)</span></div>
      </div>

      <div class="group">
        <label for="discomfort">Belly discomfort <span class="score" id="discomfortValue"></span></label>
        <input id="discomfort" type="range" min="0" max="10" value="0">
        <div class="row-labels"><span>0 (None)</span><span>10 (Severe)</span></div>
      </div>

      <div class="group">
        <label for="pain">Pain <span class="score" id="painValue"></span></label>
        <input id="pain" type="range" min="0" max="10" value="0">
        <div class="row-labels"><span>0 (None)</span><span>10 (Severe)</span></div>
      </div>

      <button id="saveButton" type="submit">Save Entry</button>
      <button id="cancelButton" class="secondary" type="button" hidden>Cancel Edit</button>
    </form>
  </section>

  <h2>Evolution Trends</h2>
  <div class="carousel" id="carousel">
    <div class="slide"><section class="card"><strong>Mood</strong><div class="chart-box"><canvas id="moodChart"></canvas></div></section></div>
    <div class="slide"><section class="card"><strong>Belly discomfort</strong><div class="chart-box"><canvas id="discomfortChart"></canvas></div></section></div>
    <div class="slide"><section class="card"><strong>Pain</strong><div class="chart-box"><canvas id="painChart"></canvas></div></section></div>
  </div>
  <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  <p class="empty">Swipe sideways to see all three graphs.</p>

  <h2>Backup & Data</h2>
  <section class="card">
    <button id="exportButton" type="button">Export CSV</button>
    <button id="importButton" class="secondary" type="button">Import CSV</button>
    <input id="csvFile" type="file" accept=".csv,text/csv">
  </section>

  <h2>Recent Entries</h2>
  <div id="entriesList"></div>

  <script>
    (() => {
      const KEY = 'belly_entries';
      const $ = id => document.getElementById(id);
      let entries = readEntries();
      const charts = {};

      function localDate(date = new Date()) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      function makeId() {
        return 'entry_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      }

      function readEntries() {
        try {
          const value = JSON.parse(localStorage.getItem(KEY) || '[]');
          return Array.isArray(value) ? value : [];
        } catch (error) {
          console.error('Could not read saved entries:', error);
          return [];
        }
      }

      function saveEntries() {
        try {
          localStorage.setItem(KEY, JSON.stringify(entries));
          renderEntries();
          renderCharts();
          return true;
        } catch (error) {
          console.error('Could not save entries:', error);
          alert('The browser could not save this entry. Try opening the app in Safari.');
          return false;
        }
      }

      function setDateTime() {
        const now = new Date();
        $('date').value = localDate(now);
        $('time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      }

      function updateScoreLabels() {
        ['mood', 'discomfort', 'pain'].forEach(id => {
          $(id + 'Value').textContent = `${$(id).value} / 10`;
        });
      }

      ['mood', 'discomfort', 'pain'].forEach(id =>
        $(id).addEventListener('input', updateScoreLabels)
      );

      function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>"']/g, char => ({
          '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
        })[char]);
      }

      function renderEntries() {
        const list = $('entriesList');
        if (!entries.length) {
          list.innerHTML = '<div class="empty">No entries yet. Save an entry using the form above.</div>';
          return;
        }

        const sorted = [...entries].sort((a, b) =>
          `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)
        );

        list.innerHTML = sorted.map(item => `
          <article class="entry">
            <div class="entry-head">
              <strong>${escapeHtml(item.category)}</strong>
              <span>${escapeHtml(item.date)} ${escapeHtml(item.time)}</span>
            </div>
            ${item.notes ? `<p>${escapeHtml(item.notes)}</p>` : ''}
            <div class="scores">
              Mood: ${item.mood}/10 · Discomfort: ${item.discomfort}/10 · Pain: ${item.pain}/10
            </div>
            <div class="entry-actions">
              <button type="button" data-action="edit" data-id="${escapeHtml(item.id)}">Edit</button>
              <button type="button" data-action="delete" data-id="${escapeHtml(item.id)}">Delete</button>
            </div>
          </article>
        `).join('');
      }

      $('entriesList').addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        const item = entries.find(entry => String(entry.id) === button.dataset.id);
        if (!item) return;

        if (button.dataset.action === 'delete') {
          if (confirm('Delete this entry?')) {
            entries = entries.filter(entry => String(entry.id) !== button.dataset.id);
            saveEntries();
          }
        } else {
          $('entryId').value = item.id;
          $('date').value = item.date;
          $('time').value = item.time;
          $('category').value = item.category;
          $('notes').value = item.notes || '';
          $('mood').value = item.mood;
          $('discomfort').value = item.discomfort;
          $('pain').value = item.pain;
          $('formTitle').textContent = 'Edit Entry';
          $('saveButton').textContent = 'Update Entry';
          $('cancelButton').hidden = false;
          updateScoreLabels();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      function resetForm() {
        $('entryForm').reset();
        $('entryId').value = '';
        $('mood').value = 5;
        $('discomfort').value = 0;
        $('pain').value = 0;
        $('formTitle').textContent = 'Log Entry';
        $('saveButton').textContent = 'Save Entry';
        $('cancelButton').hidden = true;
        setDateTime();
        updateScoreLabels();
      }

      $('cancelButton').addEventListener('click', resetForm);

      $('entryForm').addEventListener('submit', event => {
        event.preventDefault();

        const id = $('entryId').value || makeId();
        const entry = {
          id,
          date: $('date').value,
          time: $('time').value,
          category: $('category').value,
          notes: $('notes').value.trim(),
          mood: Number($('mood').value),
          discomfort: Number($('discomfort').value),
          pain: Number($('pain').value)
        };

        const index = entries.findIndex(item => String(item.id) === String(id));
        if (index >= 0) entries[index] = entry;
        else entries.unshift(entry);

        if (saveEntries()) resetForm();
      });

      function renderCharts() {
        if (typeof Chart === 'undefined') {
          document.querySelectorAll('.chart-box').forEach(box => {
            box.innerHTML = '<p class="empty">Graphs could not load. Check your internet connection and reload.</p>';
          });
          return;
        }

        const sorted = [...entries].sort((a, b) =>
          `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)
        );
        const labels = sorted.map(item => `${item.date} ${item.time}`);

        [
          ['moodChart', 'mood', '#007AFF'],
          ['discomfortChart', 'discomfort', '#FF9500'],
          ['painChart', 'pain', '#FF3B30']
        ].forEach(([canvasId, field, color]) => {
          if (charts[canvasId]) charts[canvasId].destroy();
          charts[canvasId] = new Chart($(canvasId), {
            type: 'line',
            data: {
              labels,
              datasets: [{
                data: sorted.map(item => Number(item[field])),
                borderColor: color,
                backgroundColor: color + '22',
                pointRadius: 4,
                tension: 0.2,
                fill: true
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { min: 0, max: 10, ticks: { stepSize: 1 } } },
              plugins: { legend: { display: false } }
            }
          });
        });
      }

      $('carousel').addEventListener('scroll', () => {
        const index = Math.round($('carousel').scrollLeft / $('carousel').clientWidth);
        document.querySelectorAll('.dot').forEach((dot, i) =>
          dot.classList.toggle('active', i === index)
        );
      });

      $('exportButton').addEventListener('click', () => {
        if (!entries.length) return alert('There are no entries to export.');

        const quote = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
        const rows = [
          ['ID', 'Date', 'Time', 'Category', 'Notes', 'Mood', 'Discomfort', 'Pain'],
          ...entries.map(e => [e.id, e.date, e.time, e.category, e.notes, e.mood, e.discomfort, e.pain])
        ];
        const blob = new Blob(['\uFEFF' + rows.map(row => row.map(quote).join(',')).join('\r\n')], {
          type: 'text/csv;charset=utf-8'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `belly-tracker-${localDate()}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      });

      // Import replaces current entries after confirmation.
      $('importButton').addEventListener('click', () => $('csvFile').click());
      $('csvFile').addEventListener('change', async event => {
        const file = event.target.files[0];
        if (!file) return;

        try {
          const text = (await file.text()).replace(/^\uFEFF/, '');
          const rows = text.trim().split(/\r?\n/).map(line =>
            line.match(/("(?:""|[^"])*"|[^,]*)(,|$)/g)
              ?.map(cell => cell.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"')) || []
          );

          const headers = (rows.shift() || []).map(value => value.trim().toLowerCase());
          const col = name => headers.indexOf(name.toLowerCase());
          const get = (row, name, fallback = '') => row[col(name)] ?? fallback;

          if (col('date') < 0 || col('time') < 0 || col('category') < 0) {
            throw new Error('CSV must include Date, Time, and Category columns.');
          }

          const imported = rows.filter(row => row.length > 1).map(row => ({
            id: get(row, 'id') || makeId(),
            date: get(row, 'date'),
            time: get(row, 'time'),
            category: get(row, 'category', 'Note'),
            notes: get(row, 'notes'),
            mood: Number(get(row, 'mood', 5)),
            discomfort: Number(get(row, 'discomfort', 0)),
            pain: Number(get(row, 'pain', 0))
          }));

          if (!imported.length) throw new Error('No entries found in that CSV.');
          if (confirm(`Import ${imported.length} entries? This replaces the current list.`)) {
            entries = imported;
            saveEntries();
          }
        } catch (error) {
          alert('Import failed: ' + error.message);
        } finally {
          event.target.value = '';
        }
      });

      setDateTime();
      updateScoreLabels();
      renderEntries();
      renderCharts();
    })();
  </script>
</body>
</html>
