<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F2F7">
  <title>Belly Tracker</title>

  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/baobabtang/belly-tracker-/main/icon.png">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/baobabtang/belly-tracker-/main/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --blue: #007AFF;
      --text: #111111;
      --muted: #77777D;
      --border: #E2E2E7;
      --red: #FF3B30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px
        calc(env(safe-area-inset-bottom, 16px) + 28px);
      max-width: 480px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      letter-spacing: -0.5px;
    }

    h2 {
      margin: 22px 0 12px;
      font-size: 19px;
    }

    .card, .history-card {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 1px 3px #0000000d;
    }

    .form-group { margin-bottom: 15px; }

    label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input:not([type="range"]), select, textarea {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FAFAFC;
      color: var(--text);
      font-size: 16px;
    }

    select { appearance: auto; }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    .datetime-row {
      display: flex;
      gap: 9px;
    }

    .datetime-row input { flex: 1; }

    input[type="range"] {
      width: 100%;
      height: 8px;
      margin: 10px 0 6px;
      border: 0;
      border-radius: 5px;
      background: var(--border);
      accent-color: var(--blue);
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .badge-val {
      padding: 2px 7px;
      border-radius: 6px;
      background: #E9E9EE;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }

    .btn {
      display: flex;
      width: 100%;
      min-height: 48px;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .btn-primary { background: var(--blue); color: white; }
    .btn-secondary { margin-top: 9px; background: #E5E5EA; color: var(--text); }

    .swipe-container {
      display: flex;
      width: 100%;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .swipe-container::-webkit-scrollbar { display: none; }
    .swipe-slide { flex: 0 0 100%; width: 100%; scroll-snap-align: start; }
    .swipe-slide .card { margin-bottom: 0; }
    .chart-box { position: relative; height: 230px; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 12px 0 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 8px;
      background: #D1D1D6;
    }

    .dot.active { width: 18px; background: var(--blue); }
    .hint { color: var(--muted); text-align: center; font-size: 11px; }

    .history-card { cursor: pointer; }
    .history-card:active { opacity: .8; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cat-badge {
      padding: 3px 8px;
      border-radius: 6px;
      background: #E5E5EA;
      font-size: 11px;
      font-weight: 700;
    }

    .cat-Food { background: #E1F5FE; color: #0288D1; }
    .cat-Stool { background: #EFEBE9; color: #5D4037; }
    .cat-Medication { background: #EDE7F6; color: #512DA8; }
    .cat-Symptom { background: #FFEBEE; color: #C62828; }

    .entry-date { color: var(--muted); font-size: 12px; }
    .entry-notes { margin: 7px 0; font-size: 14px; overflow-wrap: anywhere; }

    .score-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }

    .chip { padding: 3px 7px; border-radius: 6px; font-weight: 600; }
    .chip-mood { background: #E3F2FD; color: #1565C0; }
    .chip-discomfort { background: #FFF3E0; color: #E65100; }
    .chip-pain { background: #FFEBEE; color: #C62828; }

    .actions-row { display: flex; justify-content: flex-end; margin-top: 9px; }
    .action-btn {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      color: var(--red);
      font-size: 12px;
      cursor: pointer;
    }

    .empty {
      margin: 20px 0;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <h1 id="form-title">Log Entry</h1>

  <section class="card">
    <form id="entry-form">
      <input type="hidden" id="entry-id">

      <div class="form-group">
        <label for="date">Date & time</label>
        <div class="datetime-row">
          <input type="date" id="date" required>
          <input type="time" id="time" required>
        </div>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Food">🍽️ Food / Drink</option>
          <option value="Stool">💩 Stool / Bathroom</option>
          <option value="Symptom">⚠️ Symptom</option>
          <option value="Medication">💊 Medication</option>
          <option value="Note">📝 General Note</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="What did you eat? Any details to remember?"></textarea>
      </div>

      <div class="form-group">
        <label for="mood">
          <span>Mood</span><span class="badge-val" id="val-mood"></span>
        </label>
        <input type="range" id="mood" min="1" max="10" value="5">
        <div class="slider-labels"><span>1 · Very low</span><span>10 · Great</span></div>
      </div>

      <div class="form-group">
        <label for="discomfort">
          <span>Belly discomfort</span><span class="badge-val" id="val-discomfort"></span>
        </label>
        <input type="range" id="discomfort" min="1" max="10" value="1">
        <div class="slider-labels"><span>1 · None</span><span>10 · Severe</span></div>
      </div>

      <div class="form-group">
        <label for="pain">
          <span>Pain</span><span class="badge-val" id="val-pain"></span>
        </label>
        <input type="range" id="pain" min="1" max="10" value="1">
        <div class="slider-labels"><span>1 · None</span><span>10 · Severe</span></div>
      </div>

      <button type="submit" class="btn btn-primary" id="save-button">Save Entry</button>
      <button type="button" class="btn btn-secondary" id="cancel-edit" hidden>Cancel Edit</button>
    </form>
  </section>

  <h2>Trends</h2>
  <div class="swipe-container" id="swipeBox">
    <div class="swipe-slide">
      <div class="card">
        <h2 style="font-size:16px; margin-top:0">Mood</h2>
        <div class="chart-box"><canvas id="moodChart"></canvas></div>
      </div>
    </div>
    <div class="swipe-slide">
      <div class="card">
        <h2 style="font-size:16px; margin-top:0">Belly discomfort</h2>
        <div class="chart-box"><canvas id="discomfortChart"></canvas></div>
      </div>
    </div>
    <div class="swipe-slide">
      <div class="card">
        <h2 style="font-size:16px; margin-top:0">Pain</h2>
        <div class="chart-box"><canvas id="painChart"></canvas></div>
      </div>
    </div>
  </div>
  <div class="dots" aria-hidden="true">
    <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <p class="hint">Swipe left or right to view the graphs</p>

  <h2>Backup & Data</h2>
  <section class="card">
    <button type="button" class="btn btn-primary" id="exportBtn">📥 Export CSV</button>
  </section>

  <h2>Recent Entries</h2>
  <div id="entries-list"></div>

  <script>
    const STORAGE_KEY = 'belly_entries';

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function readEntries() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(saved)) return [];

        // Upgrade the old 1–5 scores once, preserving existing entries.
        if (saved.some(e => Number(e.mood) > 0 && Number(e.mood) <= 5)) {
          saved.forEach(e => {
            if (Number(e.mood) > 0 && Number(e.mood) <= 5) {
              e.mood = Number(e.mood) * 2;
            }
            if (Number(e.discomfort) > 0 && Number(e.discomfort) <= 5) {
              e.discomfort = (6 - Number(e.discomfort)) * 2;
            }
            // The old pain score measured comfort, so reverse it.
            if (Number(e.pain) > 0 && Number(e.pain) <= 5) {
              e.pain = (6 - Number(e.pain)) * 2;
            }
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        }
        return saved;
      } catch {
        return [];
      }
    }

    let entries = readEntries();
    let charts = {};

    const $ = id => document.getElementById(id);

    function setDefaultDateTime() {
      const now = new Date();
      $('date').value = localDateString(now);
      $('time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function updateVal(type) {
      $(`val-${type}`).textContent = `${$(type).value} / 10`;
    }

    ['mood', 'discomfort', 'pain'].forEach(type => {
      $(type).addEventListener('input', () => updateVal(type));
    });

    function resetForm() {
      $('entry-form').reset();
      $('entry-id').value = '';
      $('mood').value = 5;
      $('discomfort').value = 1;
      $('pain').value = 1;
      ['mood', 'discomfort', 'pain'].forEach(updateVal);
      $('form-title').textContent = 'Log Entry';
      $('save-button').textContent = 'Save Entry';
      $('cancel-edit').hidden = true;
      setDefaultDateTime();
    }

    $('entry-form').addEventListener('submit', event => {
      event.preventDefault();

      const editId = $('entry-id').value;
      const data = {
        id: editId || `id_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        date: $('date').value,
        time: $('time').value,
        category: $('category').value,
        notes: $('notes').value.trim(),
        mood: Number($('mood').value),
        discomfort: Number($('discomfort').value),
        pain: Number($('pain').value)
      };

      if (editId) {
        const index = entries.findIndex(entry => entry.id === editId);
        if (index !== -1) entries[index] = data;
      } else {
        entries.push(data);
      }

      saveData();
      resetForm();
    });

    function editEntry(id) {
      const item = entries.find(entry => entry.id === id);
      if (!item) return;

      $('entry-id').value = item.id;
      $('date').value = item.date || localDateString();
      $('time').value = item.time || '12:00';
      $('category').value = item.category || 'Note';
      $('notes').value = item.notes || '';

      $('mood').value = item.mood ?? 5;
      $('discomfort').value = item.discomfort ?? 1;
      $('pain').value = item.pain ?? 1;
      ['mood', 'discomfort', 'pain'].forEach(updateVal);

      $('form-title').textContent = 'Edit Entry';
      $('save-button').textContent = 'Update Entry';
      $('cancel-edit').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    $('cancel-edit').addEventListener('click', resetForm);

    function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      entries = entries.filter(entry => entry.id !== id);
      saveData();
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        renderHistory();
        renderCharts();
      } catch {
        alert('Could not save your entries. Please export a CSV backup and check available storage.');
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
      })[char]);
    }

    function renderHistory() {
      const container = $('entries-list');

      if (!entries.length) {
        container.innerHTML = '<p class="empty">No entries yet. Add your first entry above.</p>';
        return;
      }

      const newestFirst = [...entries].sort((a, b) =>
        `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)
      );

      container.innerHTML = newestFirst.map(item => `
        <article class="history-card" data-edit-id="${escapeHtml(item.id)}" title="Tap to edit">
          <div class="history-header">
            <span class="cat-badge cat-${escapeHtml(item.category)}">${escapeHtml(item.category)}</span>
            <time class="entry-date">${escapeHtml(item.date)} ${escapeHtml(item.time)}</time>
          </div>
          ${item.notes ? `<p class="entry-notes">${escapeHtml(item.notes)}</p>` : ''}
          <div class="score-row">
            <span class="chip chip-mood">Mood ${escapeHtml(item.mood ?? '—')}/10</span>
            <span class="chip chip-discomfort">Discomfort ${escapeHtml(item.discomfort ?? '—')}/10</span>
            <span class="chip chip-pain">Pain ${escapeHtml(item.pain ?? '—')}/10</span>
          </div>
          <div class="actions-row">
            <button type="button" class="action-btn" data-delete-id="${escapeHtml(item.id)}">🗑️ Delete</button>
          </div>
        </article>
      `).join('');
    }

    $('entries-list').addEventListener('click', event => {
      const deleteButton = event.target.closest('[data-delete-id]');
      if (deleteButton) {
        event.stopPropagation();
        deleteEntry(deleteButton.dataset.deleteId);
        return;
      }

      const card = event.target.closest('[data-edit-id]');
      if (card) editEntry(card.dataset.editId);
    });

    function renderCharts() {
      if (typeof Chart === 'undefined') return;

      const chronological = [...entries].sort((a, b) =>
        `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)
      );
      const labels = chronological.map(e => `${(e.date || '').slice(5)} ${e.time || ''}`);

      const definitions = [
        ['moodChart', 'Mood', 'mood', '#007AFF'],
        ['discomfortChart', 'Belly discomfort', 'discomfort', '#FF9500'],
        ['painChart', 'Pain', 'pain', '#FF3B30']
      ];

      definitions.forEach(([id, label, key, color]) => {
        if (charts[id]) charts[id].destroy();

        charts[id] = new Chart($(id), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label,
              data: chronological.map(e => e[key] ?? null),
              borderColor: color,
              backgroundColor: `${color}22`,
              fill: true,
              tension: 0.2,
              pointRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { min: 1, max: 10, ticks: { stepSize: 1 } },
              x: { ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } } }
            },
            plugins: { legend: { display: false } }
          }
        });
      });
    }

    $('swipeBox').addEventListener('scroll', () => {
      const index = Math.round($('swipeBox').scrollLeft / $('swipeBox').clientWidth);
      document.querySelectorAll('.dot').forEach((dot, i) =>
        dot.classList.toggle('active', i === index)
      );
    });

    function csvCell(value) {
      return `"${String(value ?? '').replace(/"/g, '""')}"`;
    }

    $('exportBtn').addEventListener('click', () => {
      if (!entries.length) {
        alert('No entries to export yet.');
        return;
      }

      const columns = ['ID', 'Date', 'Time', 'Category', 'Notes', 'Mood', 'Discomfort', 'Pain'];
      const rows = entries.map(entry => [
        entry.id, entry.date, entry.time, entry.category, entry.notes,
        entry.mood, entry.discomfort, entry.pain
      ]);

      const csv = '\uFEFF' + [columns, ...rows]
        .map(row => row.map(csvCell).join(','))
        .join('\r\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `belly_tracker_${localDateString()}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    resetForm();
    renderHistory();
    renderCharts();
  </script>
</body>
</html>
