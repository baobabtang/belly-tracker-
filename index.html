<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F2F7">
  <title>Belly Tracker</title>

  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/baobabtang/belly-tracker-/main/icon.png">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/baobabtang/belly-tracker-/main/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --blue: #007AFF;
      --text: #111111;
      --muted: #77777D;
      --border: #E2E2E7;
      --red: #FF3B30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      max-width: 480px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px
        calc(env(safe-area-inset-bottom, 16px) + 28px);
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      letter-spacing: -0.5px;
    }

    h2 {
      margin: 22px 0 12px;
      font-size: 19px;
    }

    .card, .history-card {
      width: 100%;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 1px 3px #0000000d;
    }

    .form-group { margin-bottom: 15px; }

    label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    input, select, textarea, button { font: inherit; }

    input:not([type="range"]), select, textarea {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FAFAFC;
      color: var(--text);
      font-size: 16px;
    }

    .datetime-row {
      display: flex;
      gap: 10px;
    }

    .datetime-row input { flex: 1; }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .slider-container { padding: 3px 0; }

    input[type="range"] {
      width: 100%;
      height: 8px;
      margin: 12px 0 8px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: #E5E5EA;
      accent-color: var(--blue);
    }

    .badge-val {
      padding: 2px 8px;
      border-radius: 6px;
      background: #E5E5EA;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .btn {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--blue);
      color: #FFFFFF;
    }

    .btn-secondary {
      margin-top: 10px;
      background: #E5E5EA;
      color: var(--text);
    }

    .swipe-container {
      display: flex;
      width: 100%;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .swipe-container::-webkit-scrollbar { display: none; }

    .swipe-slide {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: start;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 240px;
    }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D1D1D6;
    }

    .dot.active {
      width: 18px;
      border-radius: 4px;
      background: var(--blue);
    }

    .history-card { padding: 14px; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .cat-badge {
      padding: 3px 8px;
      border-radius: 6px;
      background: #E5E5EA;
      font-size: 11px;
      font-weight: 700;
    }

    .cat-badge.Food { background: #E1F5FE; color: #0288D1; }
    .cat-badge.Stool { background: #EFEBE9; color: #5D4037; }
    .cat-badge.Medication { background: #EDE7F6; color: #512DA8; }
    .cat-badge.Symptom { background: #FFEBEE; color: #C62828; }

    .entry-date {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .score-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 12px;
    }

    .chip {
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 600;
    }

    .chip-mood { background: #E3F2FD; color: #1565C0; }
    .chip-discomfort { background: #FFF3E0; color: #E65100; }
    .chip-pain { background: #FFEBEE; color: #C62828; }

    .actions-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #FFFFFF;
      font-size: 13px;
      cursor: pointer;
    }

    #csvFileInput { display: none; }

    .empty-message, .chart-message {
      margin: 16px 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1 id="form-title">Log Entry</h1>

  <div class="card">
    <form id="entry-form">
      <input type="hidden" id="entry-id">

      <div class="form-group">
        <label for="date">Date & Time</label>
        <div class="datetime-row">
          <input type="date" id="date" required>
          <input type="time" id="time" required>
        </div>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Food">🍽️ Food / Drink</option>
          <option value="Stool">💩 Stool</option>
          <option value="Symptom">⚠️ Pain / Symptom</option>
          <option value="Medication">💊 Medication</option>
          <option value="Note">📝 General Note</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="What did you eat, stool details, symptoms..."></textarea>
      </div>

      <div class="form-group slider-container">
        <label for="mood">
          <span>Mood</span><span class="badge-val" id="val-mood">5 / 10</span>
        </label>
        <input type="range" id="mood" min="1" max="10" value="5">
        <div class="slider-labels"><span>1 (Low)</span><span>10 (Great)</span></div>
      </div>

      <div class="form-group slider-container">
        <label for="discomfort">
          <span>Belly discomfort</span><span class="badge-val" id="val-discomfort">1 / 10</span>
        </label>
        <input type="range" id="discomfort" min="1" max="10" value="1">
        <div class="slider-labels"><span>1 (None)</span><span>10 (Severe)</span></div>
      </div>

      <div class="form-group slider-container">
        <label for="pain">
          <span>Pain</span><span class="badge-val" id="val-pain">1 / 10</span>
        </label>
        <input type="range" id="pain" min="1" max="10" value="1">
        <div class="slider-labels"><span>1 (None)</span><span>10 (Severe)</span></div>
      </div>

      <button type="submit" class="btn btn-primary" id="save-button">Save Entry</button>
      <button type="button" class="btn btn-secondary" id="cancel-edit" hidden>Cancel Edit</button>
    </form>
  </div>

  <h2>Evolution Trends</h2>
  <div class="swipe-container" id="swipeBox">
    <div class="swipe-slide">
      <div class="card">
        <h2 style="margin-top:0;font-size:16px">Mood (higher is better)</h2>
        <div class="chart-box"><canvas id="moodChart"></canvas></div>
      </div>
    </div>
    <div class="swipe-slide">
      <div class="card">
        <h2 style="margin-top:0;font-size:16px">Belly discomfort (higher is worse)</h2>
        <div class="chart-box"><canvas id="discomfortChart"></canvas></div>
      </div>
    </div>
    <div class="swipe-slide">
      <div class="card">
        <h2 style="margin-top:0;font-size:16px">Pain (higher is worse)</h2>
        <div class="chart-box"><canvas id="painChart"></canvas></div>
      </div>
    </div>
  </div>

  <div class="carousel-dots" aria-hidden="true">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <p class="empty-message">Swipe left or right to view each graph.</p>

  <h2>Backup & Data</h2>
  <div class="card">
    <button type="button" class="btn btn-primary" id="exportBtn">📥 Export to CSV</button>
    <button type="button" class="btn btn-secondary" id="importBtn">📤 Import CSV</button>
    <input type="file" id="csvFileInput" accept=".csv,text/csv">
  </div>

  <h2>Recent Entries</h2>
  <div id="entries-list"></div>

  <script>
    'use strict';

    const STORAGE_KEY = 'belly_entries';
    const $ = id => document.getElementById(id);
    let entries = loadEntries();
    const charts = {};

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function makeId() {
      return `id_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function validScore(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) && number >= 1 && number <= 10
        ? Math.round(number)
        : fallback;
    }

    function loadEntries() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(saved)) return [];
        return saved.map(item => ({
          id: String(item.id || makeId()),
          date: String(item.date || localDateString()),
          time: String(item.time || '12:00'),
          category: ['Food', 'Stool', 'Symptom', 'Medication', 'Note'].includes(item.category)
            ? item.category : 'Note',
          notes: String(item.notes || ''),
          mood: validScore(item.mood, 5),
          discomfort: validScore(item.discomfort, 1),
          pain: validScore(item.pain, 1)
        }));
      } catch (error) {
        console.error('Could not load saved entries:', error);
        return [];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        renderHistory();
        renderCharts();
      } catch (error) {
        console.error('Could not save entries:', error);
        alert('Could not save this entry. Check that browser storage is available.');
      }
    }

    function setDefaultDateTime() {
      const now = new Date();
      $('date').value = localDateString(now);
      $('time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function updateScoreLabels() {
      ['mood', 'discomfort', 'pain'].forEach(id => {
        $(`val-${id}`).textContent = `${$(id).value} / 10`;
      });
    }

    ['mood', 'discomfort', 'pain'].forEach(id => {
      $(id).addEventListener('input', updateScoreLabels);
    });

    function resetForm() {
      $('entry-form').reset();
      $('entry-id').value = '';
      $('mood').value = '5';
      $('discomfort').value = '1';
      $('pain').value = '1';
      $('form-title').textContent = 'Log Entry';
      $('save-button').textContent = 'Save Entry';
      $('cancel-edit').hidden = true;
      setDefaultDateTime();
      updateScoreLabels();
    }

    $('cancel-edit').addEventListener('click', resetForm);

    $('entry-form').addEventListener('submit', event => {
      event.preventDefault();

      const editId = $('entry-id').value;
      const entry = {
        id: editId || makeId(),
        date: $('date').value,
        time: $('time').value,
        category: $('category').value,
        notes: $('notes').value.trim(),
        mood: Number($('mood').value),
        discomfort: Number($('discomfort').value),
        pain: Number($('pain').value)
      };

      if (editId) {
        const index = entries.findIndex(item => item.id === editId);
        if (index !== -1) entries[index] = entry;
        else entries.unshift(entry);
      } else {
        entries.unshift(entry);
      }

      saveData();
      resetForm();
    });

    function editEntry(id) {
      const item = entries.find(entry => entry.id === id);
      if (!item) return;

      $('entry-id').value = item.id;
      $('date').value = item.date;
      $('time').value = item.time;
      $('category').value = item.category;
      $('notes').value = item.notes;
      $('mood').value = String(item.mood);
      $('discomfort').value = String(item.discomfort);
      $('pain').value = String(item.pain);
      $('form-title').textContent = 'Edit Entry';
      $('save-button').textContent = 'Update Entry';
      $('cancel-edit').hidden = false;
      updateScoreLabels();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      entries = entries.filter(entry => entry.id !== id);
      saveData();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&',
        '<': '<',
        '>': '>',
        '"': '"',
        "'": '''
      })[character]);
    }

    function renderHistory() {
      const container = $('entries-list');

      if (!entries.length) {
        container.innerHTML = '<p class="empty-message">No entries logged yet.</p>';
        return;
      }

      const sorted = [...entries].sort((a, b) =>
        `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)
      );

      container.innerHTML = sorted.map(item => `
        <article class="history-card">
          <div class="history-header">
            <span class="cat-badge ${escapeHtml(item.category)}">${escapeHtml(item.category)}</span>
            <span class="entry-date">${escapeHtml(item.date)} ${escapeHtml(item.time)}</span>
          </div>
          ${item.notes ? `<p style="font-size:14px;margin:6px 0">${escapeHtml(item.notes)}</p>` : ''}
          <div class="score-row">
            <span class="chip chip-mood">Mood: ${item.mood}/10</span>
            <span class="chip chip-discomfort">Discomfort: ${item.discomfort}/10</span>
            <span class="chip chip-pain">Pain: ${item.pain}/10</span>
          </div>
          <div class="actions-row">
            <button type="button" class="action-btn" data-action="edit" data-id="${escapeHtml(item.id)}">✏️ Edit</button>
            <button type="button" class="action-btn" data-action="delete" data-id="${escapeHtml(item.id)}">🗑️ Delete</button>
          </div>
        </article>
      `).join('');
    }

    $('entries-list').addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'edit') editEntry(button.dataset.id);
      if (button.dataset.action === 'delete') deleteEntry(button.dataset.id);
    });

    function renderCharts() {
      if (typeof Chart === 'undefined') {
        document.querySelectorAll('.chart-box').forEach(box => {
          box.innerHTML = '<p class="chart-message">Graphs need an internet connection to load.</p>';
        });
        return;
      }

      const chronological = [...entries].sort((a, b) =>
        `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)
      );
      const labels = chronological.map(entry => `${entry.date.slice(5)} ${entry.time}`);

      const definitions = [
        ['moodChart', 'Mood', 'mood', '#007AFF'],
        ['discomfortChart', 'Belly discomfort', 'discomfort', '#FF9500'],
        ['painChart', 'Pain', 'pain', '#FF3B30']
      ];

      definitions.forEach(([canvasId, title, key, color]) => {
        if (charts[canvasId]) charts[canvasId].destroy();

        charts[canvasId] = new Chart($(canvasId), {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: title,
              data: chronological.map(entry => entry[key]),
              borderColor: color,
              backgroundColor: `${color}22`,
              tension: 0.2,
              fill: true,
              pointRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { min: 1, max: 10, ticks: { stepSize: 1 } },
              x: { ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } } }
            },
            plugins: { legend: { display: false } }
          }
        });
      });
    }

    $('swipeBox').addEventListener('scroll', () => {
      const index = Math.round($('swipeBox').scrollLeft / $('swipeBox').clientWidth);
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    });

    function csvCell(value) {
      return `"${String(value ?? '').replace(/"/g, '""')}"`;
    }

    $('exportBtn').addEventListener('click', () => {
      if (!entries.length) {
        alert('No entries to export yet.');
        return;
      }

      const rows = [
        ['ID', 'Date', 'Time', 'Category', 'Notes', 'Mood', 'Discomfort', 'Pain'],
        ...entries.map(entry => [
          entry.id, entry.date, entry.time, entry.category, entry.notes,
          entry.mood, entry.discomfort, entry.pain
        ])
      ];

      const csv = '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `belly_tracker_${localDateString()}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (quoted) {
          if (char === '"' && text[i + 1] === '"') {
            cell += '"';
            i++;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ',') {
          row.push(cell);
          cell = '';
        } else if (char === '\n') {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = '';
        } else if (char !== '\r') {
          cell += char;
        }
      }

      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows;
    }

    $('importBtn').addEventListener('click', () => $('csvFileInput').click());

    $('csvFileInput').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const rows = parseCsv((await file.text()).replace(/^\uFEFF/, ''));
        if (rows.length < 2) throw new Error('The CSV file has no entries.');

        const headers = rows[0].map(value => value.trim().toLowerCase());
        const indexOf = name => headers.indexOf(name.toLowerCase());
        const dateIndex = indexOf('date');
        const timeIndex = indexOf('time');
        const categoryIndex = indexOf('category');

        if (dateIndex < 0 || timeIndex < 0 || categoryIndex < 0) {
          throw new Error('CSV needs Date, Time, and Category columns.');
        }

        const imported = rows.slice(1).filter(row => row.some(value => value.trim())).map(row => {
          const value = name => {
            const index = indexOf(name);
            return index < 0 ? '' : (row[index] || '').trim();
          };

          const category = value('category');
          return {
            id: value('id') || makeId(),
            date: value('date'),
            time: value('time'),
            category: ['Food', 'Stool', 'Symptom', 'Medication', 'Note'].includes(category)
              ? category : 'Note',
            notes: value('notes'),
            mood: validScore(value('mood'), 5),
            discomfort: validScore(value('discomfort'), 1),
            pain: validScore(value('pain'), 1)
          };
        });

        if (!imported.length) throw new Error('No entries found in the CSV.');

        if (confirm(`Import ${imported.length} entries? This will replace the entries currently in this app.`)) {
          entries = imported;
          saveData();
          alert(`Imported ${imported.length} entries.`);
        }
      } catch (error) {
        alert(`Could not import CSV: ${error.message}`);
      } finally {
        event.target.value = '';
      }
    });

    resetForm();
    renderHistory();
    renderCharts();
  </script>
</body>
</html>
